<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Akun — Toko Kriya Sidoarjo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="toastWrap"></div>

<div class="min-h-screen flex items-center justify-center p-4" style="background:linear-gradient(135deg,#0d9488,#115e59);">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    <div class="flex justify-center mb-4"><div class="brand-mark w-14 h-14 text-2xl">K</div></div>
    <h2 class="text-center text-2xl font-bold mb-1">Daftar Akun</h2>
    <p class="text-center text-sm text-gray-500 mb-6">Buat akun untuk mulai berbelanja</p>

    <form id="regForm" novalidate>
      <div class="mb-4">
        <label class="lb" for="nama">Nama Lengkap</label>
        <input type="text" id="nama" class="field" placeholder="Nama Anda">
        <div class="err-msg" id="err-nama">Nama minimal 3 karakter.</div>
      </div>
      <div class="mb-4">
        <label class="lb" for="email">Email</label>
        <input type="email" id="email" class="field" placeholder="nama@email.com">
        <div class="err-msg" id="err-email">Email tidak valid.</div>
      </div>
      <div class="mb-4">
        <label class="lb" for="password">Password</label>
        <input type="password" id="password" class="field" placeholder="Min. 6 karakter">
        <div class="err-msg" id="err-pass">Password minimal 6 karakter.</div>
      </div>
      <div class="mb-5">
        <label class="lb" for="cpass">Konfirmasi Password</label>
        <input type="password" id="cpass" class="field" placeholder="Ulangi password">
        <div class="err-msg" id="err-cpass">Password tidak cocok.</div>
      </div>
      <button type="submit" class="btn-solid w-full">DAFTAR</button>
    </form>

    <div class="text-center mt-5 text-sm">
      Sudah punya akun? <a href="login.html" class="text-teal font-bold">Masuk</a>
    </div>
  </div>
</div>

<script src="js/script.js"></script>
<script>
document.getElementById('regForm').addEventListener('submit', function(e){
  e.preventDefault();
  const nama=document.getElementById('nama').value.trim();
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('password').value;
  const cpass=document.getElementById('cpass').value;
  const re=/\S+@\S+\.\S+/;
  const set=(el,msg,bad)=>{(el.classList.remove('show')); if(bad)el.classList.add('show');};
  let ok=true;
  document.getElementById('nama').classList.toggle('err',nama.length<3); set(document.getElementById('err-nama'),'',nama.length<3); if(nama.length<3)ok=false;
  document.getElementById('email').classList.toggle('err',!re.test(email)); set(document.getElementById('err-email'),'',!re.test(email)); if(!re.test(email))ok=false;
  document.getElementById('password').classList.toggle('err',pass.length<6); set(document.getElementById('err-pass'),'',pass.length<6); if(pass.length<6)ok=false;
  document.getElementById('cpass').classList.toggle('err',cpass!==pass); set(document.getElementById('err-cpass'),'',cpass!==pass); if(cpass!==pass)ok=false;
  if(!ok) return;
  const res=registerUser(nama,email,pass);
  if(res.ok){ toast("Registrasi berhasil! Silakan login.","success"); setTimeout(()=>location.href="login.html",900); }
  else toast(res.msg,"error");
});
</script>
</body>
</html>
