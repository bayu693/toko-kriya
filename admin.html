<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin — Toko Kriya Sidoarjo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="toastWrap"></div>

<nav class="navbar">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
    <a href="index.html" class="flex items-center gap-2">
      <div class="brand-mark bg-wood" style="background:#8b5a2b;">A</div>
      <div class="leading-tight">
        <div class="font-head font-bold text-lg" style="font-family:'Poppins'">Panel <span class="text-wood">Admin</span></div>
        <div class="text-[10px] text-gray-400 -mt-1">Toko Kriya Sidoarjo</div>
      </div>
    </a>
    <div class="flex items-center gap-3">
      <a href="index.html" class="nav-link text-sm hidden md:inline">← Lihat Toko</a>
      <div id="navUser"></div>
      <button id="hamburger" class="hamburger p-2 hover:bg-gray-100 rounded-lg">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </div>
  <div id="mobileMenu" class="mobile-menu">
    <a href="index.html" class="nav-link">← Lihat Toko</a>
    <span id="navLinksMobile"></span>
    <span id="navUserMobile"></span>
  </div>
</nav>

<section class="max-w-7xl mx-auto px-4 py-6 flex flex-col lg:flex-row gap-6 items-start">
  <!-- Sidebar -->
  <aside class="w-full lg:w-60 bg-white border rounded-2xl p-4 lg:sticky lg:top-24">
    <div class="sidebar-link active" data-tab="dashboard">📊 Dashboard</div>
    <div class="sidebar-link" data-tab="produk">📦 Kelola Produk</div>
    <div class="sidebar-link" data-tab="pesanan">🧾 Pesanan</div>
    <div class="sidebar-link" data-tab="pengguna">👥 Pengguna</div>
    <div class="mt-4 pt-4 border-t">
      <a href="index.html" class="block sidebar-link">🏠 Lihat Toko</a>
      <a href="#" onclick="logout(); return false;" class="block sidebar-link text-red-500">🚪 Keluar</a>
    </div>
  </aside>

  <!-- Content -->
  <main id="adminContent" class="flex-1 w-full"></main>
</section>

<!-- Modal Produk -->
<div id="productModal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4" onclick="if(event.target===this)closeModal()">
  <div class="bg-white rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-6">
    <h3 id="modalTitle" class="font-head font-bold text-xl mb-5">Tambah Produk</h3>
    <form id="productForm">
      <input type="hidden" id="pId">
      <div class="mb-4"><label class="lb">Nama Produk</label><input type="text" id="pNama" class="field" required></div>
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div><label class="lb">Kategori</label>
          <select id="pKat" class="field">
            <option>Anyaman</option><option>Furniture</option><option>Batik</option><option>Aksesoris</option>
          </select>
        </div>
        <div><label class="lb">Harga (Rp)</label><input type="number" id="pHarga" class="field" min="0" required></div>
      </div>
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div><label class="lb">Stok</label><input type="number" id="pStok" class="field" min="0" required></div>
        <div><label class="lb">Gambar (SVG)</label>
          <select id="pImg" class="field">
            <option>tas-anyaman.svg</option><option>meja-kayu.svg</option><option>batik.svg</option>
            <option>tas-rotan.svg</option><option>boneka.svg</option>
            <option>kipas.svg</option><option>gantungan.svg</option><option>dompet.svg</option>
          </select>
        </div>
      </div>
      <div class="mb-5"><label class="lb">Deskripsi</label><textarea id="pDesc" class="field" rows="3" required></textarea></div>
      <div class="flex gap-3">
        <button type="button" class="btn-outline flex-1" onclick="closeModal()">Batal</button>
        <button type="submit" class="btn-solid flex-1">Simpan</button>
      </div>
    </form>
  </div>
</div>

<script src="js/script.js"></script>
<script>
const $ = id => document.getElementById(id);

/* --- guard: hanya admin --- */
function requireAdmin(){
  const s = getSession();
  if (!s || s.role !== 'admin'){
    document.body.innerHTML = `
      <div class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
        <div class="text-6xl mb-4">🔒</div>
        <h1 class="font-head text-2xl font-bold mb-2">Akses Khusus Admin</h1>
        <p class="text-gray-500 mb-6">Silakan login dengan akun admin terlebih dahulu.</p>
        <div class="flex gap-3">
          <a href="login.html" class="btn-solid">Login Admin</a>
          <a href="index.html" class="btn-outline">Ke Toko</a>
        </div>
      </div>`;
    return false;
  }
  return true;
}

let adminTab = new URLSearchParams(location.search).get('tab') || 'dashboard';
const tabs = ['dashboard','produk','pesanan','pengguna'];

function showTab(tab){
  adminTab = tab;
  document.querySelectorAll('.sidebar-link[data-tab]').forEach(el=>el.classList.toggle('active', el.dataset.tab===tab));
  if(tab==='dashboard') renderDashboard();
  if(tab==='produk') renderProduk();
  if(tab==='pesanan') renderPesanan();
  if(tab==='pengguna') renderPengguna();
}
document.querySelectorAll('.sidebar-link[data-tab]').forEach(el=>el.onclick=()=>showTab(el.dataset.tab));

/* ---------------- dashboard ---------------- */
function renderDashboard(){
  const prods = getProducts();
  const orders = getOrders();
  const users = getUsers();
  const revenue = orders.reduce((s,o)=>s+o.total,0);
  $('adminContent').innerHTML = `
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      <div class="bg-white border rounded-2xl p-5"><div class="text-3xl mb-1">📦</div><div class="text-2xl font-head font-bold">${prods.length}</div><div class="text-sm text-gray-500">Produk</div></div>
      <div class="bg-white border rounded-2xl p-5"><div class="text-3xl mb-1">🧾</div><div class="text-2xl font-head font-bold">${orders.length}</div><div class="text-sm text-gray-500">Pesanan</div></div>
      <div class="bg-white border rounded-2xl p-5"><div class="text-3xl mb-1">👥</div><div class="text-2xl font-head font-bold">${users.length}</div><div class="text-sm text-gray-500">Pengguna</div></div>
      <div class="bg-white border rounded-2xl p-5"><div class="text-3xl mb-1">💰</div><div class="text-2xl font-head font-bold">${formatRupiah(revenue)}</div><div class="text-sm text-gray-500">Pendapatan</div></div>
    </div>
    <div class="bg-white border rounded-2xl p-6">
      <h3 class="font-head font-bold text-lg mb-4">Pesanan Terbaru</h3>
      ${orders.slice(0,5).map(o=>`
        <div class="flex items-center justify-between py-2 border-b last:border-0">
          <div><div class="font-semibold text-sm">${o.nama}</div><div class="text-xs text-gray-400">${o.id} · ${o.tanggal}</div></div>
          <div class="flex items-center gap-3">
            <span class="badge-status ${o.status}">${o.status}</span>
            <b class="text-sm">${formatRupiah(o.total)}</b>
          </div>
        </div>`).join('') || '<p class="text-gray-400 text-sm">Belum ada pesanan.</p>'}
    </div>`;
}

/* ---------------- produk ---------------- */
function renderProduk(){
  const list = getProducts();
  $('adminContent').innerHTML = `
    <div class="flex items-center justify-between mb-4">
      <h2 class="font-head text-xl font-bold">Kelola Produk</h2>
      <button class="btn-solid" onclick="openModal()">+ Tambah Produk</button>
    </div>
    <div class="bg-white border rounded-2xl overflow-x-auto">
      <table class="tbl">
        <thead><tr><th>Produk</th><th>Kategori</th><th>Harga</th><th>Stok</th><th class="text-right">Aksi</th></tr></thead>
        <tbody id="prodTbody">${list.map(p=>`
          <tr>
            <td><div class="flex items-center gap-3"><img src="assets/gambar-produk/${p.img}" class="w-12 h-12 rounded-lg object-cover"><span class="font-semibold text-sm">${p.nama}</span></div></td>
            <td><span class="badge-status">${p.kategori}</span></td>
            <td class="font-bold">${formatRupiah(p.harga)}</td>
            <td>${p.stok}</td>
            <td class="text-right whitespace-nowrap">
              <button class="qty-btn inline-flex mr-1" title="Edit" onclick="editProd(${p.id})">✎</button>
              <button class="qty-btn inline-flex text-red-500" title="Hapus" onclick="delProd(${p.id})">🗑</button>
            </td>
          </tr>`).join('')}</tbody>
      </table>
    </div>`;
}
function openModal(data){
  $('modalTitle').textContent = data ? 'Edit Produk' : 'Tambah Produk';
  $('pId').value = data ? data.id : '';
  $('pNama').value = data ? data.nama : '';
  $('pKat').value = data ? data.kategori : 'Anyaman';
  $('pHarga').value = data ? data.harga : '';
  $('pStok').value = data ? data.stok : '';
  $('pImg').value = data ? data.img : 'tas-anyaman.svg';
  $('pDesc').value = data ? data.deskripsi : '';
  $('productModal').classList.remove('hidden');
}
function closeModal(){ $('productModal').classList.add('hidden'); }

$('productForm').addEventListener('submit', function(e){
  e.preventDefault();
  const id = $('pId').value;
  const data = {
    nama: $('pNama').value.trim(),
    kategori: $('pKat').value,
    harga: parseInt($('pHarga').value)||0,
    stok: parseInt($('pStok').value)||0,
    img: $('pImg').value,
    deskripsi: $('pDesc').value.trim()
  };
  if(!data.nama || !data.harga || !data.deskripsi){ toast('Lengkapi semua data produk','error'); return; }
  let list = getProducts();
  if(id){
    const idx = list.findIndex(x=>x.id===parseInt(id));
    if(idx>-1) list[idx] = {...list[idx], ...data};
    toast('Produk diperbarui','success');
  } else {
    data.id = nextId(list);
    list.push(data);
    toast('Produk ditambahkan','success');
  }
  saveProducts(list);
  closeModal();
  renderProduk();
});

function editProd(id){ openModal(getProducts().find(x=>x.id===id)); }
function delProd(id){
  if(!confirm('Yakin ingin menghapus produk ini?')) return;
  saveProducts(getProducts().filter(p=>p.id!==id));
  toast('Produk dihapus','success');
  renderProduk();
}

/* ---------------- pesanan ---------------- */
function renderPesanan(){
  const orders = getOrders();
  $('adminContent').innerHTML = `
    <h2 class="font-head text-xl font-bold mb-4">Kelola Pesanan</h2>
    <div class="bg-white border rounded-2xl overflow-x-auto">
      <table class="tbl">
        <thead><tr><th>No</th><th>Pemesan</th><th>Produk</th><th>Total</th><th>Status</th><th class="text-right">Aksi</th></tr></thead>
        <tbody>
        ${orders.map(o=>`
          <tr>
            <td class="font-semibold">${o.id}</td>
            <td><div class="text-sm font-semibold">${o.nama}</div><div class="text-xs text-gray-400">${o.hp}</div></td>
            <td><div class="text-xs max-w-[180px]">${o.items.map(i=>`${i.nama}×${i.qty}`).join(', ')}</div></td>
            <td class="font-bold">${formatRupiah(o.total)}</td>
            <td><span class="badge-status ${o.status}">${o.status}</span></td>
            <td class="text-right">
              <select class="field !py-1 text-sm w-28" onchange="setStatus(${orders.indexOf(o)}, this.value)">
                ${['Proses','Dikirim','Selesai'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}
              </select>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
      ${!orders.length?'<p class="text-gray-400 text-sm p-6 text-center">Belum ada pesanan masuk.</p>':''}
    </div>`;
}
function setStatus(idx, val){
  const orders = getOrders();
  orders[idx].status = val;
  setOrders(orders);
  toast('Status pesanan diperbarui','success');
  renderPesanan();
}

/* ---------------- pengguna ---------------- */
function renderPengguna(){
  const users = getUsers();
  $('adminContent').innerHTML = `
    <h2 class="font-head text-xl font-bold mb-4">Daftar Pengguna</h2>
    <div class="bg-white border rounded-2xl overflow-x-auto">
      <table class="tbl">
        <thead><tr><th>Nama</th><th>Email</th></tr></thead>
        <tbody>
        ${users.map(u=>`<tr><td class="font-semibold">${u.nama}</td><td>${u.email}</td></tr>`).join('')}
        </tbody>
      </table>
      ${!users.length?'<p class="text-gray-400 text-sm p-6 text-center">Belum ada pengguna terdaftar.</p>':''}
    </div>`;
}

/* init */
if(requireAdmin()){
  showTab(adminTab);
}
</script>
</body>
</html>
